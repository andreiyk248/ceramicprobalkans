<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B2B-админка Ceramic Pro Balkans</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Saira:wght@600;700&display=swap">
<style>

/* Layout: order form, not a shop window. Phone: one column + bottom bar. Laptop: left rail, list, sticky order summary. */
:root{
  --paper:#FFFFFF; --foam:#F1F5F6; --ink:#231F20; --ink-soft:#465661; --steel:#63757F;
  --line:#DCE4E8; --line-soft:#EAF0F2; --magenta:#EC008C; --magenta-deep:#C20073; --on-magenta:#FFFFFF;
  --sea:#0B2430; --on-sea:#E8F1F4; --water:#0E7C99;
  --ok:#17794A; --warn:#9A5B00; --bad:#B3261E; --info:#0E7C99;
  --ok-bg:#E4F3EA; --warn-bg:#FBEFD6; --bad-bg:#FBE4E2; --info-bg:#DDF0F5; --mute-bg:#EAF0F2;
  --f-display:'Saira',system-ui,sans-serif; --f-body:'Manrope',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --gx:max(16px, env(safe-area-inset-left, 0px)); --gxr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#101A20; --foam:#16232B; --ink:#EEF3F5; --ink-soft:#B9C7CE; --steel:#8FA1AA;
  --line:#2A3A43; --line-soft:#1F2D35; --magenta:#FF3FA9; --magenta-deep:#FF6BBD; --on-magenta:#1A0A12;
  --sea:#081920; --on-sea:#E8F1F4; --water:#4FB8D3;
  --ok:#6FD3A0; --warn:#F0BD62; --bad:#F2928B; --info:#6CC6DE;
  --ok-bg:#16332A; --warn-bg:#3A2D12; --bad-bg:#3D1E1C; --info-bg:#123039; --mute-bg:#1F2D35; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#101A20; --foam:#16232B; --ink:#EEF3F5; --ink-soft:#B9C7CE; --steel:#8FA1AA;
  --line:#2A3A43; --line-soft:#1F2D35; --magenta:#FF3FA9; --magenta-deep:#FF6BBD; --on-magenta:#1A0A12;
  --sea:#081920; --on-sea:#E8F1F4; --water:#4FB8D3;
  --ok:#6FD3A0; --warn:#F0BD62; --bad:#F2928B; --info:#6CC6DE;
  --ok-bg:#16332A; --warn-bg:#3A2D12; --bad-bg:#3D1E1C; --info-bg:#123039; --mute-bg:#1F2D35; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--foam);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--steel)} .small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* prototype strip */
.proto{background:var(--sea);color:var(--on-sea);font-size:12.5px}
.proto .in{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:6px;padding-left:var(--gx);padding-right:var(--gxr)}
.proto select{background:transparent;color:var(--on-sea);border:1px solid #ffffff55;border-radius:6px;padding:3px 6px;max-width:100%}
.proto option{color:#111}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--steel)}
.btn.pri{background:var(--magenta);border-color:var(--magenta);color:var(--on-magenta)}
.btn.pri:hover{background:var(--magenta-deep);border-color:var(--magenta-deep)}
.btn.pri[disabled]{background:var(--mute-bg);border-color:var(--line);color:var(--steel);cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.txt{border-color:transparent;background:transparent;padding:0 8px;color:var(--water)}
.btn.block{width:100%}
.btn.wrap{white-space:normal;padding-block:8px;text-align:center}

/* public pages */
.pub-head{background:var(--paper);border-bottom:1px solid var(--line)}
.pub-head .in,.pub .in{max-width:1040px;margin:0 auto;padding-left:var(--gx);padding-right:var(--gxr)}
.pub-head .in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.04em;font-size:15px;white-space:nowrap}
.brand b{color:var(--magenta)}
.pub .in{padding-block:28px 56px;display:grid;gap:28px}
.hero h1{font-size:clamp(28px,5.4vw,44px);max-width:16ch}
.hero p{max-width:60ch;color:var(--ink-soft);margin-top:12px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.steps3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));counter-reset:s}
.steps3 li{list-style:none;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;counter-increment:s}
.steps3 li::before{content:counter(s);font-family:var(--f-mono);color:var(--magenta);font-size:13px}
.steps3{padding:0;margin:0}
.narrow{max-width:520px;margin:0 auto;width:100%}

/* panels */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px}
.panel{min-width:0}
.panel>.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.panel>.bd{padding:14px 16px}
.stack{display:grid;gap:14px}
.stack.s8{gap:8px}

/* forms */
.fld{display:grid;gap:5px}
.fld label{font-weight:600;font-size:14px}
.fld label i{font-style:normal;font-weight:400;color:var(--steel)}
.inp{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.inp:focus{outline:2px solid var(--magenta);outline-offset:0;border-color:transparent}
.fld.err .inp{border-color:var(--bad)}
.fld .e{color:var(--bad);font-size:13px}
.fld .h{color:var(--steel);font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;min-height:32px}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--magenta);flex:none}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--magenta)}
.rules{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px;color:var(--steel)}
.rules .ok{color:var(--ok)}

/* app shell */
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
.main{min-width:0;padding-block:16px 150px;padding-left:var(--gx);padding-right:var(--gxr);display:grid;gap:16px;align-content:start}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.co{font-weight:700}
.rail{display:none}
.tab{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab button{position:relative;border:0;background:none;min-height:54px;font-size:12px;font-weight:600;color:var(--steel);cursor:pointer;padding:0 2px}
.tab button.on{color:var(--ink)}
.tab button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--ink)}
.tab button.cta{color:var(--magenta)}
.tab .cnt,.rail .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--magenta);color:var(--on-magenta);font-size:11px;line-height:18px;font-family:var(--f-mono)}

/* alerts, pills */
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:10px;background:var(--warn-bg);color:var(--ink);border:1px solid transparent}
.alert b{color:var(--warn)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.grey{background:var(--mute-bg);color:var(--ink-soft)} .pill.blue{background:var(--info-bg);color:var(--info)}
.pill.amber{background:var(--warn-bg);color:var(--warn)} .pill.green{background:var(--ok-bg);color:var(--ok)} .pill.red{background:var(--bad-bg);color:var(--bad)}

/* lists */
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line-soft);min-width:0}
.li:first-child{border-top:0}
.li>.g{min-width:0;flex:1}
.li.click{cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.li.click:hover{background:var(--foam)}
.kv{display:grid;grid-template-columns:minmax(96px,34%) minmax(0,1fr);gap:6px 12px}
.kv dt{color:var(--steel)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* order form */
.tools{display:grid;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sec{padding:10px 16px 6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);background:var(--foam);border-top:1px solid var(--line-soft)}
.sec:first-child{border-top:0;border-radius:10px 10px 0 0}
.prod{padding:10px 16px;border-top:1px solid var(--line-soft);display:grid;gap:6px}
.prod .nm{background:none;border:0;padding:0;text-align:left;font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.var{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.var .meta{min-width:0;font-size:13px;color:var(--steel)}
.var .meta span{white-space:nowrap}
.st{display:inline-grid;grid-template-columns:40px 46px 40px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.st button{height:40px;border:0;background:none;font-size:18px;cursor:pointer}
.st button:hover{background:var(--foam)}
.st input{width:46px;height:40px;border:0;border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);text-align:center;background:none;font-family:var(--f-mono);padding:0}
.st.has{border-color:var(--ink)}
.case{background:none;border:0;padding:0;color:var(--water);font-size:12.5px;cursor:pointer;text-decoration:underline}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.in{background:var(--ok)} .dot.order{background:var(--warn)} .dot.none{background:var(--bad)}
.cartbar{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--sea);color:var(--on-sea);display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:8px;padding-left:var(--gx);padding-right:var(--gxr)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--magenta)}
.tot{display:grid;gap:6px}
.tot div{display:flex;justify-content:space-between;gap:12px}
.tot .big{font-weight:700;font-size:17px;padding-top:8px;border-top:1px solid var(--line)}
.side{display:none}
.two,.cols2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}

/* order status track */
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:11.5px;color:var(--steel);text-align:center}
.track i{display:block;height:4px;border-radius:2px;background:var(--line);margin-bottom:6px}
.track .done i{background:var(--ink)} .track .cur i{background:var(--magenta)}
.track .done,.track .cur{color:var(--ink)}
.track span{font-size:0}
.track span i{margin-bottom:0}
.chg{background:var(--warn-bg);border-radius:8px;padding:10px 12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:0;background:none;padding:10px 12px;font-weight:600;color:var(--steel);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tblw{overflow-x:auto}

/* sheet + toast */
.scrim{position:fixed;inset:0;z-index:40;background:#0009;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);text-align:center}

@media (min-width:900px){
  body{font-size:15px}
  .app{grid-template-columns:228px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:2px;padding:20px 12px;border-right:1px solid var(--line);background:var(--paper);min-height:calc(100vh - 34px);position:sticky;top:0;align-self:start}
  .rail .brand{padding:0 10px 4px}
  .rail .who{padding:0 10px 14px;color:var(--steel);font-size:13px;border-bottom:1px solid var(--line-soft);margin-bottom:10px}
  .rail button.nv{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;font-weight:600;color:var(--ink-soft);cursor:pointer}
  .rail button.nv:hover{background:var(--foam)}
  .rail button.nv.on{background:var(--foam);color:var(--ink)}
  .rail .mgr{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line-soft);font-size:13px;color:var(--steel)}
  .tab,.cartbar,.topbar .co{display:none}
  .main{padding:24px 28px 60px}
  .two{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
  .side{display:grid;gap:14px;position:sticky;top:16px}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .scrim{align-items:center}
  .sheet{border-radius:14px}
  .toast{bottom:32px}
  .var{grid-template-columns:minmax(0,1fr) 110px auto}
  .track span{font-size:11.5px}
  .track span i{margin-bottom:6px}
  .tr-cap{display:none}
}
@media (prefers-reduced-motion:no-preference){ .toast{animation:up .18s ease-out} @keyframes up{from{opacity:.4;translate:0 6px}to{opacity:1;translate:0 0}} }

/* admin additions: laptop first; on a phone the rail becomes a scrolling strip */
.main{padding-bottom:60px}
.anav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:8px;padding-left:var(--gx);padding-right:var(--gxr);background:var(--paper);border-bottom:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{display:grid;gap:2px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);cursor:pointer}
.stat:hover{border-color:var(--steel)}
.stat b{font-family:var(--f-mono);font-size:28px;font-weight:500;line-height:1.1}
.stat.hot b{color:var(--magenta)}
.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;color:var(--steel);font-weight:600;font-size:13px;padding:10px 12px;white-space:nowrap}
.t td{padding:8px 12px;border-top:1px solid var(--line-soft);vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--foam)}
.t .r{text-align:right}
.t .inp{min-height:36px;padding:4px 8px}
.t input.inp{width:96px;text-align:right;font-family:var(--f-mono)}
.t tr.dirty td:first-child{box-shadow:inset 3px 0 0 var(--magenta)}
.note{padding:10px 12px;border-radius:8px;font-size:14px}
.note.ok{background:var(--ok-bg)} .note.ok b{color:var(--ok)}
.note.warn{background:var(--warn-bg)} .note.warn b{color:var(--warn)}
.docbox{border:1px dashed var(--line);border-radius:8px;padding:28px 12px;text-align:center;color:var(--steel);background:var(--foam)}
.mail{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--foam);font-size:14px}
@media (min-width:900px){ .anav{display:none} }
</style>

function vOrder1(){const o=ORD.find(x=>x.no===S.arg)||ORD[0], c=C(o.c), s=sum(o), nx=NEXT[o.status], editable=o.status==='sent', changed=o.edit&&o.items.some(([k,q])=>o.edit[k]!==undefined&&o.edit[k]!==q);

    <div class="bd tot" style="border-top:1px solid var(--line-soft)"><div><span>Сумма без НДС</span><span class="num">${fmt(s)}</span></div><div class="big"><span>Всего с НДС 21%</span><span class="num">${fmt(s*(1+VAT))}</span></div></div>
    ${changed?`<div class="bd stack s8" style="border-top:1px solid var(--line-soft)"><div class="fld"><label for="why">Причина изменения</label><input class="inp" id="why" value="${esc(o.why||'')}" placeholder="Например: в наличии 1 шт, поставка 24 ноября"><span class="h">Клиент увидит причину рядом с изменённой строкой.</span></div><div class="row"><button class="btn pri" data-a="sendchg" data-v="${o.no}">Отправить изменения клиенту</button><button class="btn" data-a="undo" data-v="${o.no}">Вернуть как было</button></div></div>`:''}</div>
   <div class="panel"><div class="hd"><h2>Переписка и заметки</h2></div>
    <div class="bd stack s8"><textarea class="inp" id="msg" rows="2" aria-label="Текст" placeholder="Текст сообщения или заметки"></textarea><div class="row"><button class="btn sm" data-a="msg" data-v="${o.no}">Написать клиенту</button><button class="btn sm" data-a="note" data-v="${o.no}">Сохранить как внутреннюю заметку</button></div></div></div>
   <div class="panel"><div class="hd"><h2>История</h2></div>${o.log.map(([d,t,k])=>`<div class="li"><span class="muted small" style="flex:none;width:118px">${d}</span><span class="g">${k?`<span class="pill ${k==='int'?'grey':'blue'}">${k==='int'?'внутренняя':'клиенту'}</span> `:''}${esc(t)}</span></div>`).join('')}</div>
  </div><div class="stack">
   <div class="panel"><div class="hd"><h2>Следующий шаг</h2></div><div class="bd stack">${
    changed?`<p class="muted">Сначала отправьте изменения клиенту или верните состав как был.</p>`
    :nx?`<button class="btn pri block" data-a="next" data-v="${o.no}">${nx[0]}</button>${nx[2]?`<p class="small muted">Клиент получит письмо. Перед отправкой вы увидите текст.</p>`:(o.status==='paid'?`<p class="small muted">Письмо клиенту на этом шаге не уходит.</p>`:'')}${o.status==='changed'?`<p class="small muted">Обычно клиент отвечает сам в кабинете. Кнопка нужна, если он согласился по телефону.</p>`:''}`
    :`<p class="muted">${o.status==='delivered'?'Заказ завершён.':'Заказ отменён.'}</p>`}
    ${['sent','changed','awaiting','paid','packed'].includes(o.status)?`<button class="btn block" data-a="ocancel" data-v="${o.no}">Отменить заказ</button>`:''}</div></div>
   <div class="panel"><div class="hd"><h2>Клиент</h2></div><div class="bd stack s8"><p><b>${esc(c.name)}</b><br><span class="muted small">${c.group} · ${c.pay} · оформил: ${esc(o.by)}</span></p><div><button class="btn sm" data-a="go" data-v="cust1" data-arg="${c.id}">Карточка клиента</button></div></div></div>
   <div class="panel"><div class="hd"><h2>Документы</h2><span class="muted small">${o.docs.length}</span></div>${o.docs.map(([t,n])=>`<div class="li"><div class="g"><b>${t} ${n}</b><br><span class="muted small">PDF · виден клиенту</span></div></div>`).join('')}
    <div class="bd stack s8"><div class="docbox" style="padding:16px 12px">Перетащите файл сюда</div><div class="row">${['Проформа','Счёт','Накладная'].map(t=>`<button class="btn sm" data-a="adddoc" data-v="${o.no}" data-t="${t}">+ ${t}</button>`).join('')}</div></div></div>
   ${o.track?`<div class="panel"><div class="hd"><h2>Отгрузка</h2></div><div class="bd"><span class="muted small">Трек-номер</span><br><span class="mono">${esc(o.track)}</span>${o.eta?`<br><span class="muted small">Ожидается ${esc(o.eta)}</span>`:''}</div></div>`:''}
  </div></div>`)}
function prodRows(){const q=S.pq.trim().toLowerCase(), rows=CAT.filter(p=>(S.pcat==='all'||p.cat===S.pcat)&&(!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)));
  return rows.length?rows.map(p=>`<tr class="${S.dirty.has(p.sku)?'dirty':''}" data-row="${p.sku}"><td><span class="mono small">${p.sku}</span></td><td><b>${esc(p.name)}</b><br><span class="muted small">${CATS[p.cat]} · ${esc(p.pack)}</span></td>
   <td class="r">${p.mode==='cart'?`<input class="inp" id="p-${p.sku}" data-p="${p.sku}" data-f="price" inputmode="decimal" value="${p.price.toFixed(2)}" aria-label="Базовая цена">`:'<span class="muted small">по запросу</span>'}</td>
   <td class="r">${p.mode==='cart'?`<input class="inp" id="d-${p.sku}" data-p="${p.sku}" data-f="dealer" inputmode="decimal" value="${p.dealer.toFixed(2)}" aria-label="Цена дилера">`:''}</td>
   <td><select class="inp" id="s-${p.sku}" data-p="${p.sku}" data-f="stock" aria-label="Наличие">${[['in','в наличии'],['order','под заказ'],['none','нет']].map(([v,t])=>`<option value="${v}" ${p.stock===v?'selected':''}>${t}</option>`).join('')}</select></td>
   <td class="r num">${p.cq}</td><td><input type="checkbox" id="v-${p.sku}" data-p="${p.sku}" data-f="shown" ${p.shown?'checked':''} aria-label="Показан в каталоге" style="width:20px;height:20px;accent-color:var(--magenta)"></td></tr>`).join(''):`<tr><td colspan="7" class="muted">Ничего не нашлось. Проверьте написание или выберите другой раздел.</td></tr>`}
const dirtyHTML=()=>S.dirty.size?`<span class="small">Изменено строк: <b>${S.dirty.size}</b></span><button class="btn pri sm" data-a="psave">Сохранить изменения</button>`:`<span class="small muted">Изменений нет</span>`;
function vProducts(){return shell(head('Товары и цены',`<button class="btn sm" data-a="toast" data-v="Здесь загружается таблица с ценами: артикул и новая цена.">Загрузить цены из таблицы</button>`)+`
  <p class="muted small">Цены без НДС, в евро. Меняются прямо в ячейке. Цены условные.</p>
  <input class="inp" id="pq" type="search" placeholder="Название или артикул" value="${esc(S.pq)}" aria-label="Поиск по товарам">
  <div class="chips">${[['all','Все'],...Object.entries(CATS)].map(([k,t])=>`<button class="chip ${S.pcat===k?'on':''}" data-a="pcat" data-v="${k}">${t}</button>`).join('')}</div>
  <div class="row" id="dirty" style="justify-content:flex-end;min-height:36px">${dirtyHTML()}</div>
  <div class="panel tblw"><table class="t"><thead><tr><th>Артикул</th><th>Товар</th><th class="r">Базовая</th><th class="r">Дилер</th><th>Наличие</th><th class="r">В коробке</th><th>Показан</th></tr></thead><tbody id="prows">${prodRows()}</tbody></table></div>`)}
function vDocs(){return shell(head('Документы на продукцию',`<button class="btn sm" data-a="toast" data-v="Откроется загрузка: файл, тип, товары, язык, срок действия.">Загрузить документ</button>`)+`
  <p class="muted small">Эти документы видят все клиенты в разделе «Документы». Когда паспорт безопасности обновляется, покупавшие товар клиенты получают уведомление.</p>
  <div class="panel">${DOCS.map(d=>`<div class="li"><div class="g"><b>${d[0]}</b> · ${d[1]}<br><span class="muted small">${d[2]} · ${d[3]}${d[4]?' · от '+d[4]:''}</span></div>${d[5]?`<span class="pill ${d[5]==='31.12.2026'?'amber':'grey'}">${d[5]==='31.12.2026'?'истекает '+d[5]:'до '+d[5]}</span>`:''}<button class="btn sm" data-a="toast" data-v="Откроется замена файла новой версией.">Обновить</button></div>`).join('')}</div>
  <p class="small muted">За месяц до конца срока действия администратор получает напоминание.</p>`)}

/* ---------- sheets ---------- */
function sheetHTML(){const s=S.sheet; if(!s) return ''; let b='',close='Отмена';
  if(s.t==='mail') b=`<h2>${esc(s.title)}</h2><p class="small muted">Клиент получит это письмо:</p><div class="mail"><b>${esc(s.subj)}</b><br>${esc(s.body)}</div><button class="btn pri block" data-a="mail-yes">${esc(s.btn)}</button>`;
  if(s.t==='clarify') b=`<h2>Запросить уточнение</h2><div class="stack s8">${['Документ о регистрации компании','Налоговый номер не найден в реестре','Название не совпадает с реестром','Нужен рабочий адрес почты'].map((t,i)=>`<label class="chk"><input type="checkbox" id="cl${i}" value="${t}" ${i===0?'checked':''}><span>${t}</span></label>`).join('')}</div><div class="fld"><label for="cltext">Свой текст <i>необязательно</i></label><textarea class="inp" id="cltext" rows="2"></textarea></div><button class="btn pri block" data-a="clarify-yes">Отправить запрос клиенту</button>`;
  if(s.t==='reject') b=`<h2>Отклонить заявку</h2><div class="fld"><label for="rjwhy">Причина</label>${sel('rjwhy',['Кабинет открыт только компаниям','Компания не найдена в реестре','Не работаем в этой стране','Другое'],'')}</div><div class="fld"><label for="rjtext">Что написать клиенту <i>необязательно</i></label><textarea class="inp" id="rjtext" rows="2"></textarea></div><button class="btn pri block" data-a="reject-yes">Отклонить и отправить письмо</button>`;
  if(s.t==='ship') b=`<h2>Отгрузка заказа ${s.no}</h2><div class="fld"><label for="sh-car">Служба доставки</label>${sel('sh-car',['Курьерская служба','Собственная доставка','Самовывоз'],'')}</div><div class="fld ${s.err?'err':''}"><label for="sh-track">Трек-номер</label><input class="inp" id="sh-track" value="${esc(s.track||'')}">${s.err?`<span class="e">Укажите трек-номер: клиент увидит его в кабинете. Для самовывоза напишите «самовывоз».</span>`:''}</div><div class="fld"><label for="sh-eta">Ожидаемая дата доставки <i>необязательно</i></label><input class="inp" id="sh-eta" type="date"></div><p class="small muted">Клиент получит письмо «Заказ отгружен» с трек-номером и накладной.</p><button class="btn pri block" data-a="ship-yes">Отметить отгрузку</button>`;
  if(s.t==='block') b=`<h2>Заблокировать доступ</h2><p>Сотрудники компании не смогут войти и оформить заказ. Заказы и документы сохранятся.</p><div class="fld ${s.err?'err':''}"><label for="blwhy">Причина</label><input class="inp" id="blwhy">${s.err?`<span class="e">Укажите причину: она останется в карточке клиента.</span>`:''}</div><button class="btn pri block" data-a="block-yes">Заблокировать</button>`;
  if(s.t==='ocancel') b=`<h2>Отменить заказ ${s.no}?</h2><div class="fld ${s.err?'err':''}"><label for="ocwhy">Причина</label><input class="inp" id="ocwhy">${s.err?`<span class="e">Укажите причину: клиент увидит её в письме.</span>`:''}</div><button class="btn pri block" data-a="ocancel-yes">Отменить заказ и уведомить клиента</button>`,close='Не отменять';
  if(s.t==='mkorder') b=`<h2>Заказ за клиента</h2><p class="small muted">Для заказов, принятых по телефону или в WhatsApp. Клиент увидит заказ в своей истории.</p><div class="fld"><label for="mk-c">Клиент</label><select class="inp" id="mk-c">${CUST.filter(c=>c.status==='active').map(c=>`<option value="${c.id}" ${c.id===s.c?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div class="fld ${s.bad?'err':''}"><label for="mk-lines">Позиции: артикул и количество, по одной в строке</label><textarea class="inp mono" id="mk-lines" rows="5">${esc(s.text===undefined?'CP-9H-50 6\nCP-TOP-50 6\nCP-CARE-300 12':s.text)}</textarea>${s.bad?`<span class="e">${esc(s.bad)}</span>`:`<span class="h">Можно вставить строки из таблицы или письма.</span>`}</div><button class="btn pri block" data-a="mk-yes">Создать заказ</button>`;
  return `<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true">${b}<button class="btn block" data-a="close">${close}</button></div></div>`}

/* ---------- engine ---------- */
const VIEWS={dash:vDash,apps:vApps,app1:vApp1,custs:vCusts,cust1:vCust1,orders:vOrders,order1:vOrder1,products:vProducts,docs:vDocs};
function render(keep){const y=window.scrollY;document.getElementById('app').innerHTML=VIEWS[S.view]()+sheetHTML()+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:'');window.scrollTo(0,keep?y:0)}
function go(v,arg){S.view=v;S.arg=arg||null;S.sheet=null;render()}
function toast(m){S.toast=m;render(true);clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;const t=document.querySelector('.toast');if(t)t.remove()},2800)}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const O=no=>ORD.find(o=>o.no===no), A=id=>APPS.find(a=>a.id===id);
function advance(o,to,logText,doc){o.status=to;o.overdue=false;if(doc&&!o.docs.some(d=>d[0]===doc))o.docs.push([doc,o.no.slice(-4)]);if(to==='awaiting'&&!o.due)o.due='25 ноября';o.log.unshift([NOW,logText])}

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a,v=el.dataset.v;
  if(a==='scrim'){if(ev.target===el){S.sheet=null;render(true)}return}
  switch(a){
   case 'go': go(v,el.dataset.arg);break;
   case 'stat': if(v==='apps')S.appTab=el.dataset.tab; else S.ordTab=el.dataset.tab; go(v);break;
   case 'toast': toast(v);break;
   case 'close': S.sheet=null;render(true);break;
   case 'copy': (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Скопировано')).catch(()=>toast('Не удалось скопировать. Выделите текст вручную.'));break;
   case 'atab': S.appTab=v;render(true);break;
   case 'otab': S.ordTab=v;render(true);break;
   case 'pcat': S.pcat=v;render(true);break;
   case 'approve': {const ap=A(v),g=val('ap-group'),p=val('ap-pay'),l=parseInt(val('ap-limit'),10)||0,m=val('ap-mgr');
     pending=()=>{const id='c'+(CUST.length+1);CUST.push({id,name:ap.company,country:ap.country,city:ap.addr.split(',').pop().trim(),tax:ap.taxL+' '+ap.tax,addr:ap.addr,group:g,pay:p,limit:l,status:'active',mgr:m,last:'ещё не заказывал',staff:[[ap.name,ap.email,'Владелец']],notes:[]});ap.status='approved';ap.cust=id;S.sheet=null;render(true);toast('Заявка одобрена. Клиент создан, письмо ушло бы на почту.')};
     S.sheet={t:'mail',title:'Одобрить заявку',subj:'Доступ в кабинет Ceramic Pro Balkans открыт',body:`Здравствуйте, ${ap.name}! Мы проверили данные компании ${ap.company}. Цены и заказы уже доступны. Условия оплаты: ${p.toLowerCase()}.`,btn:'Одобрить и отправить письмо'};render(true);break}
   case 'clarify': S.sheet={t:'clarify',id:v};render(true);break;
   case 'clarify-yes': {const ap=A(S.sheet.id),items=[...document.querySelectorAll('.sheet input[type=checkbox]:checked')].map(i=>i.value),t=val('cltext');
     if(!items.length&&!t){toast('Отметьте, чего не хватает, или напишите свой текст.');break}
     ap.status='clarify';ap.asked=[...items,t].filter(Boolean).join('; ');S.sheet=null;render(true);toast('Запрос отправлен. Заявка перешла в «Ждут уточнения».');break}
   case 'reject': S.sheet={t:'reject',id:v};render(true);break;
   case 'reject-yes': {const ap=A(S.sheet.id);ap.status='rejected';ap.reason=val('rjwhy');S.sheet=null;render(true);toast('Заявка отклонена. Клиент получил бы письмо с причиной.');break}
   case 'csave': {const c=C(v);c.group=val('c-group');c.pay=val('c-pay');c.limit=parseInt(val('c-limit'),10)||0;c.mgr=val('c-mgr');render(true);toast('Условия сохранены. Изменение записано в журнал.');break}
   case 'cnote': {const t=val('cnote');if(!t){toast('Напишите текст заметки.');break}C(v).notes.unshift(['11 ноября',t]);render(true);break}
   case 'block': S.sheet={t:'block',id:v};render(true);break;
   case 'block-yes': {const w=val('blwhy');if(!w){S.sheet.err=true;render(true);break}const c=C(S.sheet.id);c.status='blocked';c.why=w;S.sheet=null;render(true);toast('Доступ заблокирован.');break}
   case 'unblock': {const c=C(v);c.status='active';c.why='';render(true);toast('Доступ возвращён.');break}
   case 'oq': {const o=O(S.arg),orig=o.items.find(i=>i[0]===v)[1];o.edit=o.edit||{};o.edit[v]=Math.max(0,qty(o,v,orig)+parseInt(el.dataset.d,10));o.why=val('why')||o.why;render(true);break}
   case 'undo': {const o=O(v);delete o.edit;delete o.why;render(true);break}
   case 'sendchg': {const o=O(v),w=val('why');if(!w){toast('Укажите причину: клиент увидит её рядом с изменённой строкой.');break}
     const ch=o.items.filter(([k,q])=>o.edit[k]!==undefined&&o.edit[k]!==q).map(([k,q])=>`${P[k].name} ${P[k].pack}: ${q} → ${o.edit[k]}`).join('; ');
     pending=()=>{o.items=o.items.map(([k,q])=>[k,qty(o,k,q)]).filter(i=>i[1]>0);delete o.edit;delete o.why;advance(o,'changed',`Состав изменён: ${ch}. Причина: ${w}`);S.sheet=null;render(true);toast('Изменения отправлены. Ждём ответа клиента.')};
     S.sheet={t:'mail',title:'Отправить изменения клиенту',subj:`Заказ ${o.no}: изменён состав`,body:`${ch}. Причина: ${w}. Подтвердите изменения в кабинете одним нажатием.`,btn:'Отправить'};render(true);break}
   case 'next': {const o=O(v),nx=NEXT[o.status];
     if(nx[1]==='ship'){S.sheet={t:'ship',no:v};render(true);break}
     const run=()=>{advance(o,nx[1],nx[1]==='awaiting'?'Подтверждён, выставлена проформа':nx[1]==='paid'?'Оплата получена':nx[1]==='packed'?'Собран':'Доставлен',nx[4]);S.sheet=null;render(true);toast('Статус изменён: '+STAT[nx[1]][0].toLowerCase()+'.')};
     if(nx[2]){pending=run;S.sheet={t:'mail',title:nx[0],subj:nx[2].replace('{no}',o.no),body:nx[3],btn:nx[0]+' и отправить письмо'};render(true)} else run();break}
   case 'mail-yes': if(pending){const f=pending;pending=null;f()}break;
   case 'ship-yes': {const tr=val('sh-track');if(!tr){S.sheet.err=true;render(true);break}const o=O(S.sheet.no);o.track=tr;o.eta=val('sh-eta');advance(o,'shipped',`Отгружен · ${val('sh-car')} · ${tr}`,'Накладная');S.sheet=null;render(true);toast('Отгрузка отмечена. Клиент получил бы письмо с трек-номером.');break}
   case 'ocancel': S.sheet={t:'ocancel',no:v};render(true);break;
   case 'ocancel-yes': {const w=val('ocwhy');if(!w){S.sheet.err=true;render(true);break}const o=O(S.sheet.no);delete o.edit;delete o.req;advance(o,'cancelled','Отменён менеджером. Причина: '+w);S.sheet=null;render(true);toast('Заказ отменён.');break}
   case 'reqdone': {const o=O(v),t=val('msg');if(!t){toast('Напишите ответ клиенту в поле «Переписка и заметки» ниже.');const m=document.getElementById('msg');if(m)m.focus();break}o.log.unshift([NOW,t,'msg']);delete o.req;render(true);toast('Ответ отправлен, запрос закрыт.');break}
   case 'msg': case 'note': {const t=val('msg');if(!t){toast('Напишите текст.');break}O(v).log.unshift([NOW,t,a==='note'?'int':'msg']);render(true);toast(a==='note'?'Заметка сохранена. Клиент её не видит.':'Сообщение появится у клиента в истории заказа.');break}
   case 'adddoc': {const o=O(v),t=el.dataset.t;if(o.docs.some(d=>d[0]===t)){toast('Такой документ уже есть в заказе.');break}o.docs.push([t,o.no.slice(-4)]);o.log.unshift([NOW,'Загружен документ: '+t]);render(true);toast('Строка добавлена для примера. В прототипе файл не загружается.');break}
   case 'mkorder': S.sheet={t:'mkorder',c:v||'c1'};render(true);break;
   case 'mk-yes': {const text=document.getElementById('mk-lines').value,c=val('mk-c'),items=[],bad=[];
     text.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{const m=l.split(/[\s;,]+/),k=(m[0]||'').toUpperCase(),q=parseInt(m[1],10);if(P[k]&&P[k].mode==='cart'&&q>0)items.push([k,q]);else bad.push(l)});
     if(bad.length||!items.length){S.sheet={t:'mkorder',c,text,bad:bad.length?'Не распознаны строки: '+bad.join(' · ')+'. Проверьте артикул и количество.':'Добавьте хотя бы одну позицию.'};render(true);break}
     const no='CPB-2026-0'+(S.seq++);ORD.unshift({no,c,date:'сегодня',status:'sent',by:'принят по телефону',items,docs:[],log:[[NOW,'Заказ внесён менеджером']]});go('order1',no);toast('Заказ создан. Клиент увидит его в своей истории.');break}
   case 'psave': {const n=S.dirty.size;S.dirty.clear();render(true);toast(`Сохранено строк: ${n}. Изменения цен записаны в журнал.`);break}
  }});
document.addEventListener('input',ev=>{const t=ev.target; if(t.id==='pq'){S.pq=t.value;document.getElementById('prows').innerHTML=prodRows()}
  if(t.id==='why'&&S.view==='order1'){const o=O(S.arg);if(o)o.why=t.value}});
document.addEventListener('change',ev=>{const t=ev.target, k=t.dataset.p; if(!k) return; const p=P[k], f=t.dataset.f;
  if(f==='shown') p.shown=t.checked; else if(f==='stock') p.stock=t.value;
  else {const n=parseFloat(t.value.replace(',','.')); if(!(n>=0)){t.value=p[f].toFixed(2);toast('Цена должна быть числом, например 60,00.');return} p[f]=Math.round(n*100)/100;t.value=p[f].toFixed(2)}
  S.dirty.add(k);const r=document.querySelector('[data-row="'+k+'"]');if(r)r.classList.add('dirty');document.getElementById('dirty').innerHTML=dirtyHTML()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.sheet){S.sheet=null;render(true)}});
render();
</script>
