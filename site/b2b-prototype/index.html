<style>
/* Layout: order form, not a shop window. Phone: one column + bottom bar. Laptop: left rail, list, sticky order summary. */
:root{
  --paper:#FFFFFF; --foam:#F1F5F6; --ink:#231F20; --ink-soft:#465661; --steel:#63757F;
  --line:#DCE4E8; --line-soft:#EAF0F2; --magenta:#EC008C; --magenta-deep:#C20073; --on-magenta:#FFFFFF;
  --sea:#0B2430; --on-sea:#E8F1F4; --water:#0E7C99;
  --ok:#17794A; --warn:#9A5B00; --bad:#B3261E; --info:#0E7C99;
  --ok-bg:#E4F3EA; --warn-bg:#FBEFD6; --bad-bg:#FBE4E2; --info-bg:#DDF0F5; --mute-bg:#EAF0F2;
  --f-display:'Saira',system-ui,sans-serif; --f-body:'Manrope',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --gx:max(16px, env(safe-area-inset-left, 0px)); --gxr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#101A20; --foam:#16232B; --ink:#EEF3F5; --ink-soft:#B9C7CE; --steel:#8FA1AA;
  --line:#2A3A43; --line-soft:#1F2D35; --magenta:#FF3FA9; --magenta-deep:#FF6BBD; --on-magenta:#1A0A12;
  --sea:#081920; --on-sea:#E8F1F4; --water:#4FB8D3;
  --ok:#6FD3A0; --warn:#F0BD62; --bad:#F2928B; --info:#6CC6DE;
  --ok-bg:#16332A; --warn-bg:#3A2D12; --bad-bg:#3D1E1C; --info-bg:#123039; --mute-bg:#1F2D35; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#101A20; --foam:#16232B; --ink:#EEF3F5; --ink-soft:#B9C7CE; --steel:#8FA1AA;
  --line:#2A3A43; --line-soft:#1F2D35; --magenta:#FF3FA9; --magenta-deep:#FF6BBD; --on-magenta:#1A0A12;
  --sea:#081920; --on-sea:#E8F1F4; --water:#4FB8D3;
  --ok:#6FD3A0; --warn:#F0BD62; --bad:#F2928B; --info:#6CC6DE;
  --ok-bg:#16332A; --warn-bg:#3A2D12; --bad-bg:#3D1E1C; --info-bg:#123039; --mute-bg:#1F2D35; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--foam);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--steel)} .small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* prototype strip */
.proto{background:var(--sea);color:var(--on-sea);font-size:12.5px}
.proto .in{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:6px;padding-left:var(--gx);padding-right:var(--gxr)}
.proto select{background:transparent;color:var(--on-sea);border:1px solid #ffffff55;border-radius:6px;padding:3px 6px;max-width:100%}
.proto option{color:#111}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--steel)}
.btn.pri{background:var(--magenta);border-color:var(--magenta);color:var(--on-magenta)}
.btn.pri:hover{background:var(--magenta-deep);border-color:var(--magenta-deep)}
.btn.pri[disabled]{background:var(--mute-bg);border-color:var(--line);color:var(--steel);cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.txt{border-color:transparent;background:transparent;padding:0 8px;color:var(--water)}
.btn.block{width:100%}
.btn.wrap{white-space:normal;padding-block:8px;text-align:center}

/* public pages */
.pub-head{background:var(--paper);border-bottom:1px solid var(--line)}
.pub-head .in,.pub .in{max-width:1040px;margin:0 auto;padding-left:var(--gx);padding-right:var(--gxr)}
.pub-head .in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.04em;font-size:15px;white-space:nowrap}
.brand b{color:var(--magenta)}
.pub .in{padding-block:28px 56px;display:grid;gap:28px}
.hero h1{font-size:clamp(28px,5.4vw,44px);max-width:16ch}
.hero p{max-width:60ch;color:var(--ink-soft);margin-top:12px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.steps3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));counter-reset:s}
.steps3 li{list-style:none;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;counter-increment:s}
.steps3 li::before{content:counter(s);font-family:var(--f-mono);color:var(--magenta);font-size:13px}
.steps3{padding:0;margin:0}
.narrow{max-width:520px;margin:0 auto;width:100%}

/* panels */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px}
.panel{min-width:0}
.panel>.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.panel>.bd{padding:14px 16px}
.stack{display:grid;gap:14px}
.stack.s8{gap:8px}

/* forms */
.fld{display:grid;gap:5px}
.fld label{font-weight:600;font-size:14px}
.fld label i{font-style:normal;font-weight:400;color:var(--steel)}
.inp{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.inp:focus{outline:2px solid var(--magenta);outline-offset:0;border-color:transparent}
.fld.err .inp{border-color:var(--bad)}
.fld .e{color:var(--bad);font-size:13px}
.fld .h{color:var(--steel);font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;min-height:32px}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--magenta);flex:none}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--magenta)}
.rules{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px;color:var(--steel)}
.rules .ok{color:var(--ok)}

/* app shell */
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
.main{min-width:0;padding-block:16px 150px;padding-left:var(--gx);padding-right:var(--gxr);display:grid;gap:16px;align-content:start}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.co{font-weight:700}
.rail{display:none}
.tab{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab button{position:relative;border:0;background:none;min-height:54px;font-size:12px;font-weight:600;color:var(--steel);cursor:pointer;padding:0 2px}
.tab button.on{color:var(--ink)}
.tab button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--ink)}
.tab button.cta{color:var(--magenta)}
.tab .cnt,.rail .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--magenta);color:var(--on-magenta);font-size:11px;line-height:18px;font-family:var(--f-mono)}

/* alerts, pills */
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:10px;background:var(--warn-bg);color:var(--ink);border:1px solid transparent}
.alert b{color:var(--warn)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.grey{background:var(--mute-bg);color:var(--ink-soft)} .pill.blue{background:var(--info-bg);color:var(--info)}
.pill.amber{background:var(--warn-bg);color:var(--warn)} .pill.green{background:var(--ok-bg);color:var(--ok)} .pill.red{background:var(--bad-bg);color:var(--bad)}

/* lists */
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line-soft);min-width:0}
.li:first-child{border-top:0}
.li>.g{min-width:0;flex:1}
.li.click{cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.li.click:hover{background:var(--foam)}
.kv{display:grid;grid-template-columns:minmax(96px,34%) minmax(0,1fr);gap:6px 12px}
.kv dt{color:var(--steel)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* order form */
.tools{display:grid;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sec{padding:10px 16px 6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);background:var(--foam);border-top:1px solid var(--line-soft)}
.sec:first-child{border-top:0;border-radius:10px 10px 0 0}
.prod{padding:10px 16px;border-top:1px solid var(--line-soft);display:grid;gap:6px}
.prod .nm{background:none;border:0;padding:0;text-align:left;font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.var{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.var .meta{min-width:0;font-size:13px;color:var(--steel)}
.var .meta span{white-space:nowrap}
.st{display:inline-grid;grid-template-columns:40px 46px 40px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.st button{height:40px;border:0;background:none;font-size:18px;cursor:pointer}
.st button:hover{background:var(--foam)}
.st input{width:46px;height:40px;border:0;border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);text-align:center;background:none;font-family:var(--f-mono);padding:0}
.st.has{border-color:var(--ink)}
.case{background:none;border:0;padding:0;color:var(--water);font-size:12.5px;cursor:pointer;text-decoration:underline}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.in{background:var(--ok)} .dot.order{background:var(--warn)} .dot.none{background:var(--bad)}
.cartbar{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--sea);color:var(--on-sea);display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:8px;padding-left:var(--gx);padding-right:var(--gxr)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--magenta)}
.tot{display:grid;gap:6px}
.tot div{display:flex;justify-content:space-between;gap:12px}
.tot .big{font-weight:700;font-size:17px;padding-top:8px;border-top:1px solid var(--line)}
.side{display:none}
.two,.cols2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}

/* order status track */
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:11.5px;color:var(--steel);text-align:center}
.track i{display:block;height:4px;border-radius:2px;background:var(--line);margin-bottom:6px}
.track .done i{background:var(--ink)} .track .cur i{background:var(--magenta)}
.track .done,.track .cur{color:var(--ink)}
.track span{font-size:0}
.track span i{margin-bottom:0}
.chg{background:var(--warn-bg);border-radius:8px;padding:10px 12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:0;background:none;padding:10px 12px;font-weight:600;color:var(--steel);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tblw{overflow-x:auto}

/* sheet + toast */
.scrim{position:fixed;inset:0;z-index:40;background:#0009;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);text-align:center}

@media (min-width:900px){
  body{font-size:15px}
  .app{grid-template-columns:228px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:2px;padding:20px 12px;border-right:1px solid var(--line);background:var(--paper);min-height:calc(100vh - 34px);position:sticky;top:0;align-self:start}
  .rail .brand{padding:0 10px 4px}
  .rail .who{padding:0 10px 14px;color:var(--steel);font-size:13px;border-bottom:1px solid var(--line-soft);margin-bottom:10px}
  .rail button.nv{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;font-weight:600;color:var(--ink-soft);cursor:pointer}
  .rail button.nv:hover{background:var(--foam)}
  .rail button.nv.on{background:var(--foam);color:var(--ink)}
  .rail .mgr{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line-soft);font-size:13px;color:var(--steel)}
  .tab,.cartbar,.topbar .co{display:none}
  .main{padding:24px 28px 60px}
  .two{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
  .side{display:grid;gap:14px;position:sticky;top:16px}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .scrim{align-items:center}
  .sheet{border-radius:14px}
  .toast{bottom:32px}
  .var{grid-template-columns:minmax(0,1fr) 110px auto}
  .track span{font-size:11.5px}
  .track span i{margin-bottom:6px}
  .tr-cap{display:none}
}
@media (prefers-reduced-motion:no-preference){ .toast{animation:up .18s ease-out} @keyframes up{from{opacity:.4;translate:0 6px}to{opacity:1;translate:0 0}} }
</style>

  if(t==='addr') b=`<div class="panel">${ADDR.map(a=>`<div class="li"><div class="g"><b>${esc(a.name)}</b> ${a.main?'<span class="pill grey">основной</span>':''}<br>${esc(a.line)}<br><span class="muted small">${esc(a.who)} · ${esc(a.note)}</span></div><button class="btn sm" data-a="toast" data-v="Откроется редактирование адреса.">Изменить</button></div>`).join('')}</div><div><button class="btn" data-a="toast" data-v="Откроется форма нового адреса.">Добавить адрес</button></div>`;
  if(t==='team') b=`<div class="panel">${[['Marko Marković','marko@studio.me','Владелец','всё, включая сотрудников'],['Jelena Petrović','jelena@studio.me','Закупщик','заказы и документы'],['Ana Kovač','racuni@studio.me','Бухгалтер','только документы и история']].map(u=>`<div class="li"><div class="g"><b>${u[0]}</b> <span class="pill grey">${u[2]}</span><br><span class="muted small">${u[1]} · ${u[3]}</span></div></div>`).join('')}</div><div><button class="btn" data-a="toast" data-v="Приглашение ушло бы на почту сотрудника.">Пригласить сотрудника</button></div>`;
  if(t==='terms') b=`<div class="panel"><div class="bd"><dl class="kv"><dt>Ценовая группа</dt><dd>Студия</dd><dt>Оплата</dt><dd>Предоплата по проформе</dd><dt>Минимальный заказ</dt><dd class="num">${fmt(MIN)}</dd><dt>Бесплатная доставка</dt><dd>от <span class="num">${fmt(FREE)}</span></dd></dl></div></div><p class="small muted">Условия задаёт менеджер. Значения в прототипе условные.</p>`;
  return shell(head('Компания')+`<div class="tabs">${[['req','Реквизиты'],['addr','Адреса доставки'],['team','Сотрудники'],['terms','Условия']].map(([k,x])=>`<button class="${t===k?'on':''}" data-a="ctab" data-v="${k}">${x}</button>`).join('')}</div>${b}`)}
function vHelp(){return shell(head('Помощь')+`<div class="cols2 stack"><div class="panel"><div class="hd"><h2>Ваш менеджер</h2></div><div class="bd stack s8"><p><b>Ceramic Pro Balkans</b>, Тиват</p><p>WhatsApp и телефон: <span class="mono">+382 68 356 883</span> <button class="btn txt sm" data-a="copy" data-v="+38268356883">Скопировать</button></p><p>Почта: <span class="mono">info@ceramicprobalkans.com</span> <button class="btn txt sm" data-a="copy" data-v="info@ceramicprobalkans.com">Скопировать</button></p><div><button class="btn" data-a="toast" data-v="Откроется форма: выбрать заказ, описать проблему, приложить фото.">Сообщить о проблеме с заказом</button></div></div></div>
  <div class="panel"><div class="hd"><h2>Частые вопросы</h2></div><div class="bd stack s8"><p><b>Как оплатить заказ?</b> По проформе, банковским переводом. Реквизиты есть в карточке заказа.</p><p><b>Когда приедет заказ?</b> Срок виден в карточке заказа после отгрузки.</p><p><b>Пришёл брак или не тот товар?</b> Сообщите через форму выше, приложите фото.</p><p><b>Нужен документ на состав?</b> Раздел «Документы», вкладка «Документы на продукцию».</p></div></div></div>`)}
function vMore(){return shell(head('Ещё')+`<div class="panel">${[['templates','Шаблоны заказов'],['company','Компания'],['help','Помощь'],['landing','Выйти']].map(([k,t])=>`<button class="li click" data-a="go" data-v="${k}"><span class="g"><b>${t}</b></span><span class="muted">→</span></button>`).join('')}</div>`)}

/* ---------- sheets ---------- */
function sheetHTML(){const s=S.sheet; if(!s) return ''; let b='';
  if(s.t==='card'){const p=P[s.sku], vs=CAT.filter(x=>x.name===p.name&&x.cat===p.cat);
    b=`<h2>${esc(p.name)}</h2><p class="muted">${CATS[p.cat]} · ${esc(p.line)}${p.note?' · '+esc(p.note):''}</p><p>Описание, норма расхода и область применения берутся из каталога производителя. В прототипе текст не заполнен.</p>
     <div class="stack s8">${vs.map(variantRow).join('')}</div>
     <div class="stack s8"><h3>Документы</h3><div class="row"><button class="btn sm" data-a="dl">Паспорт безопасности</button><button class="btn sm" data-a="dl">Техническое описание</button></div></div>`}
  if(s.t==='opts'){const p=P[s.sku],o=OPTS[s.sku];
    b=`<h2>${esc(p.name)}</h2><p class="muted">${esc(p.pack)} · <span class="num">${fmt(p.price)}</span> · выберите: ${o.label.toLowerCase()}</p>${o.note?`<p class="small muted">${o.note}</p>`:''}
     <div>${o.list.map(v=>`<div class="li" style="padding-left:0;padding-right:0"><span class="g">${esc(v)}</span>${stepper(p.sku+'|'+v)}</div>`).join('')}</div>`}
  if(s.t==='repeat') b=`<h2>В корзине уже есть товары</h2><p>Добавить позиции заказа ${s.no} к корзине или заменить корзину этим заказом?</p><div class="row"><button class="btn pri" data-a="rep-add">Добавить к корзине</button><button class="btn" data-a="rep-new">Заменить</button></div>`;
  if(s.t==='addr') b=`<h2>Адрес доставки</h2><div>${ADDR.map(a=>`<button class="li click" style="padding-left:0;padding-right:0" data-a="setaddr" data-v="${a.id}"><span class="g"><b>${esc(a.name)}</b><br><span class="muted small">${esc(a.line)}</span></span>${S.addr===a.id?'<span class="pill green">выбран</span>':''}</button>`).join('')}</div>`;
  if(s.t==='cancel') b=`<h2>Отменить заказ ${s.no}?</h2><p>Заказ ещё не подтверждён, поэтому отменится сразу.</p><div class="row"><button class="btn pri" data-a="cancel-yes">Отменить заказ</button><button class="btn" data-a="close">Оставить</button></div>`;
  return `<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true">${b}<button class="btn block" data-a="close">${s.t==='opts'||s.t==='card'?'Готово':'Закрыть'}</button></div></div>`}

/* ---------- render ---------- */
const VIEWS={landing:vLanding,login:vLogin,register:vRegister,pending:vPending,home:vHome,order:vOrder,cart:vCart,sent:vSent,orders:vOrders,order1:vOrder1,templates:vTemplates,docs:vDocs,company:vCompany,help:vHelp,more:vMore};
let toastT;
function render(keepScroll){const y=window.scrollY; document.getElementById('app').innerHTML=VIEWS[S.view]()+sheetHTML()+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:'');
  const j=document.getElementById('jump'); if([...j.options].some(o=>o.value===S.view)) j.value=S.view;
  if(keepScroll) window.scrollTo(0,y); else window.scrollTo(0,0)}
function go(v,arg){S.view=v;S.arg=arg||null;S.sheet=null;render()}
function toast(m){S.toast=m;render(true);clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;const t=document.querySelector('.toast');if(t)t.remove()},2600)}
function setQty(key,q){q=Math.max(0,Math.min(999,q|0)); if(q) S.cart[key]=q; else delete S.cart[key]}
function refreshOrder(key){ if(S.view==='order'&&!S.sheet&&key&&!key.includes('|')){
    document.querySelectorAll('[data-q="'+key+'"]').forEach(i=>{i.value=S.cart[key]||0;i.parentNode.classList.toggle('has',!!S.cart[key])});
    document.getElementById('side').innerHTML=summaryHTML();document.getElementById('cartbar').innerHTML=cartbarHTML();
    const n=cartLines().length; document.querySelectorAll('.tab [data-v="order"]').forEach(b=>b.innerHTML='Заказ'+(n?'<span class="cnt">'+n+'</span>':''));
    document.querySelectorAll('.rail [data-v="order"]').forEach(b=>b.innerHTML='Новый заказ'+(n?'<span class="cnt">'+n+'</span>':''));
  } else render(true)}
function fill(items,replace){if(replace)S.cart={};items.forEach(([k,q])=>{if(stock(P[k.split('|')[0]])!=='none')S.cart[k]=(S.cart[k]||0)+q})}
function validateReg(){const r=S.reg,e={},req=(k,m)=>{if(!(r[k]||'').trim())e[k]=m};
  if(r.step===1){const [tl,tn]=TAX[r.country],v=(r.tax||'').replace(/\s/g,'');
    if(!v)e.tax=`Укажите ${tl}`; else if(tn&&!/^\d+$/.test(v))e.tax=`${tl} состоит только из цифр`; else if(tn&&v.length!==tn)e.tax=`${tl} состоит из ${tn} цифр, сейчас ${v.length}`; else if(!tn&&v.length<8)e.tax='Номер слишком короткий. Укажите его с кодом страны.';
    req('company','Укажите название, как в документах');req('regno','Укажите регистрационный номер');req('street','Укажите улицу и дом');req('city','Укажите город');req('zip','Укажите индекс')}
  if(r.step===2){req('name','Укажите имя и фамилию'); if(!/^\S+@\S+\.\S+$/.test(r.email||''))e.email='Проверьте адрес: нужен вид name@company.com'; if((r.phone||'').replace(/\D/g,'').length<8)e.phone='Укажите номер с кодом страны, например +382 67 000 111';
    const pw=r.pass||''; if(!(pw.length>=10&&/[a-zа-я]/i.test(pw)&&/\d/.test(pw)))e.pass='Пароль пока не подходит под требования выше'}
  if(r.step===3){if(!r.c1||!r.c2)e.c='Чтобы отправить заявку, отметьте оба согласия'}
  S.err=e; return !Object.keys(e).length}

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a,v=el.dataset.v;
  if(a==='scrim'){if(ev.target===el){S.sheet=null;render(true)} return}
  switch(a){
   case 'go': go(v);break;
   case 'toast': toast(v);break;
   case 'dl': toast('В прототипе файлы не скачиваются.');break;
   case 'copy': (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Скопировано')).catch(()=>toast('Не удалось скопировать. Выделите текст вручную.'));break;
   case 'inc': setQty(v,(S.cart[v]||0)+1);refreshOrder(v);break;
   case 'dec': setQty(v,(S.cart[v]||0)-1);refreshOrder(v);break;
   case 'case': setQty(v,(S.cart[v]||0)+P[v].cq);refreshOrder(v);break;
   case 'del': delete S.cart[v];render(true);break;
   case 'cat': S.cat=v;render(true);break;
   case 'reset': S.q='';S.cat='all';S.mine=false;render();break;
   case 'card': S.sheet={t:'card',sku:v};render(true);break;
   case 'opts': S.sheet={t:'opts',sku:v};render(true);break;
   case 'close': S.sheet=null;render(true);break;
   case 'open': go('order1',v);break;
   case 'otab': S.ordTab=v;render(true);break;
   case 'dtab': S.docTab=v;S.docQ='';render(true);break;
   case 'ctab': S.coTab=v;render(true);break;
   case 'repeat': {const o=ORD.find(x=>x.no===v); if(cartLines().length){S.sheet={t:'repeat',no:v};render(true)} else {fill(o.items,true);go('cart')}break}
   case 'rep-add': fill(ORD.find(x=>x.no===S.sheet.no).items,false);go('cart');break;
   case 'rep-new': fill(ORD.find(x=>x.no===S.sheet.no).items,true);go('cart');break;
   case 'tpl': fill(TPL[v].items,false);go('cart');break;
   case 'savetpl': TPL.push({name:'Новый шаблон '+(TPL.length+1),items:cartLines().map(l=>[l.key,l.q])});toast('Шаблон сохранён. Название можно изменить в разделе «Шаблоны».');break;
   case 'addr': S.sheet={t:'addr'};render(true);break;
   case 'setaddr': S.addr=v;S.sheet=null;render(true);break;
   case 'send': {if(cartSum()<MIN)break; ORD.unshift({no:'CPB-2026-0'+(S.seq++),date:'2026-11-11',status:'sent',po:S.po,by:'Marko M.',items:cartLines().map(l=>[l.key,l.q]),log:[['11 ноября, сейчас','Отправлен · Marko M.']]});
     ORD[0].items.forEach(i=>bought.add(i[0].split('|')[0])); S.cart={};S.po='';S.note='';go('sent');break}
   case 'accept': {const o=ORD.find(x=>x.no===v);o.status='awaiting';o.due='20 ноября';o.log.unshift(['11 ноября, сейчас','Вы согласились с изменением. Выставлена проформа']);render(true);toast('Спасибо. Проформа выставлена.');break}
   case 'cancel': S.sheet={t:'cancel',no:v};render(true);break;
   case 'cancel-yes': {const o=ORD.find(x=>x.no===S.sheet.no);o.status='cancelled';o.log.unshift(['11 ноября, сейчас','Отменён вами']);S.sheet=null;render(true);toast('Заказ отменён.');break}
   case 'reqcancel': {const o=ORD.find(x=>x.no===v);o.req=true;o.log.unshift(['11 ноября, сейчас','Вы запросили отмену или изменение']);render(true);toast('Запрос отправлен менеджеру.');break}
   case 'regback': S.reg.step--;S.err={};render();break;
   case 'showpw': S.reg.show=!S.reg.show;render(true);break;
  }});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target.dataset.form;
  if(f==='login') go('home');
  if(f==='reg'){ if(!validateReg()){render(true);const e=document.querySelector('.fld.err .inp, .e');if(e){e.scrollIntoView({block:'center'});if(e.focus)e.focus()}return}
    if(S.reg.step<3){S.reg.step++;render()} else go('pending')}});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.dataset.r){S.reg[t.dataset.r]=t.value; if(t.dataset.r==='pass'){const r=document.getElementById('pwrules');if(r)r.innerHTML=pwRules(t.value)}}
  if(t.id==='q'){S.q=t.value;document.getElementById('list').innerHTML=listHTML()}
  if(t.id==='oq'){S.ordQ=t.value;document.getElementById('olist').innerHTML=ordersHTML()}
  if(t.id==='dq'){S.docQ=t.value;document.getElementById('dlist').innerHTML=docsHTML()}
  if(t.id==='po')S.po=t.value; if(t.id==='note')S.note=t.value});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='jump'){go(t.value);return}
  if(t.dataset.q!==undefined){setQty(t.dataset.q,parseInt(t.value,10)||0);refreshOrder(t.dataset.q)}
  if(t.id==='mine'){S.mine=t.checked;render(true)}
  if(t.dataset.r==='country'){S.err={};render(true)}
  if(t.dataset.rc)S.reg[t.dataset.rc]=t.checked;
  if(t.dataset.ri!==undefined)S.reg.interests[t.dataset.ri]=t.checked});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.sheet){S.sheet=null;render(true)}});
render();
</script>
